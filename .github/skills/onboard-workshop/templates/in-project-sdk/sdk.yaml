#
# In-project SDK definition. Directory name must match `name:`; the consuming
# workshop lists it as `project-<sdk-name>`. Setup logic lives in scripts
# under hooks/ (setup-base, setup-project, check-health, save-state,
# restore-state; +x by convention) — there is NO `hooks:` key in sdk.yaml; a
# hooks key here is rejected by the runtime validator ("unknown SDK YAML
# fields: hooks"; the published schema-sdk.json is permissive and won't catch
# it). Only sketch SDKs inline hooks in YAML.

name: <sdk-name>

# Optional: declare interface endpoints this SDK provides or consumes.
# Uncomment and adapt what the project needs; delete the rest.
#
# A tunnel slot exposing a dev server that runs inside the workshop
# (pair it with a same-named tunnel plug grafted on the system SDK):
# slots:
#   <server-name>:
#     interface: tunnel
#     endpoint: <port>
#
# A desktop plug for GUI test hosts (Electron, browsers under xvfb).
# Requires a manual `workshop connect` after launch:
# plugs:
#   desktop:
#     interface: desktop
#
# A credential the dev loop needs on every run (Workshop 0.9.8+) — only when
# the user asked for it; the default is `workshop run --env NAME`. No
# attributes, never a value: the user adds a `secret` slot under `system`
# and runs `workshop connect <ws>/<sdk-name>:api-key <ws>/system:<slot>`.
# Inside the workshop it is read with
# `workshopctl get-secret <sdk-name>.api-key` (bare name, no `project-`):
#   api-key:
#     interface: secret
