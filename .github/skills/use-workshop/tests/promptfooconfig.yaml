description: |
  Routing and behavior eval for the use-workshop skill.
  Each scenario file under `scenarios/` contributes test cases that simulate
  a user prompt; the SKILL.md is loaded as the chat system message via the
  prompt.json template; assertions check that the model picks the right
  `workshop` or `sdk` command, surfaces the right flags, and avoids known
  anti-patterns.

# Chat-format prompt: {{skill}} expands to SKILL.md contents (loaded via
# defaultTest.vars.skill below); {{user}} comes from each scenario case.
prompts:
  - file://prompt.json

providers:
  # NOTE: the default target of `scripts/run-routing.sh` is NOT the first entry
  # here — the script names it explicitly. Since 2026-08-13 that default is
  # `openrouter:z-ai/glm-5.2` (see the GLM block below).
  #
  # This config is the HTTP lane only. The Anthropic HTTP tiers were retired
  # 2026-08-20: the Sonnet confirmation run now goes through the claude CLI
  # subscription lane instead ($0, no API key) — see
  # promptfooconfig-subscription.yaml and `make eval-routing-subscription`.
  # The 2026-06 multi-family open-weight matrix (Kimi, DeepSeek, MiMo, gpt-oss,
  # Nemotron, Gemma, Llama, Mistral, Qwen3) was retired at the same time; the
  # measured rates live in BASELINE.md and the provider blocks in git history.

  # --- OpenRouter (open-weight) providers ----------------------------------
  # GLM (Zhipu) family split across tiers, mirroring the Haiku/Sonnet/Opus
  # roles above. `glm-5.2` is the DEFAULT target of `make eval-routing` and the
  # pinned CI gate (2026-08-13); the other tiers stay diagnostic-only and run
  # when selected explicitly via `scripts/run-routing.sh --provider
  # openrouter:<slug>` (or the `make eval-routing-sweep` target).
  # Every row here requires OPENROUTER_API_KEY.
  #
  # Slugs must be confirmed against https://openrouter.ai/models (they drift).
  # Caveat: OpenRouter slugs are not in promptfoo's built-in cost table, so the
  # committed summary reports `cost_usd: 0` — check the OpenRouter dashboard for
  # real spend. temperature/max_tokens are honored (the openrouter provider
  # extends the OpenAI chat provider), so these runs stay deterministic.
  #
  # (The Qwen3 family was the initial trial — see BASELINE.md for that
  # comparison; GLM was adopted afterward.)
  #
  # Three tiers (refreshed 2026-07-23) mirroring the Haiku/Sonnet/Opus
  # diagnostic roles. The prior 4.5-air/4.5/4.6 and glm-5 generations are
  # superseded; their results stay in BASELINE.md as a historical record.
  #
  # Clarity diagnostic (≈ Haiku role) — small/fast flash tier.
  - id: openrouter:z-ai/glm-4.7-flash
    config:
      max_tokens: 1024
      temperature: 0.0
  # Baseline / default target (≈ Sonnet role).
  - id: openrouter:z-ai/glm-5.1
    config:
      max_tokens: 1024
      temperature: 0.0
  # PRIMARY BASELINE and CI gate (2026-08-13) — newest flagship (1M context).
  # Promoted from the headroom (≈ Opus) role after the routing eval moved off
  # Anthropic; see BASELINE.md for the rationale and the pass-rate pin.
  #
  # `provider:` is OpenRouter's provider-routing object, passed through by
  # promptfoo's openrouter provider. It is what makes this row a GATE rather
  # than a snapshot: OpenRouter serves this slug from ~32 backends at
  # quantizations from fp8 down to fp4 and picks one per request, so an
  # unconstrained row measures a different machine run to run. fp8 + no
  # fallbacks holds the measuring conditions still while still tolerating a
  # single backend being down. (The diagnostic tiers below are deliberately
  # left unpinned — they are snapshots by design.)
  #
  # showThinking:false grades the ANSWER, not the reasoning trace. GLM-5.2
  # returns a `reasoning` field and promptfoo's openrouter provider otherwise
  # prepends it to the output — measured at ~12% of the graded text on a
  # sample case. That is the wrong artifact to grade twice over: the Anthropic
  # rows were never graded on hidden reasoning, and a reasoning trace
  # enumerates-and-rejects options far more freely than a final answer does,
  # which is exactly what trips the suite's `not-contains` guards (see the
  # mention-vs-prescription assertion fixes in BASELINE.md).
  #
  # max_tokens 3072, not the 1024 used for cross-row parity elsewhere. GLM-5.2
  # bills reasoning against the same budget, so with showThinking:false a
  # reasoning-heavy case can spend the whole 1024 thinking and return an EMPTY
  # answer — measured: 9 of 76 cases hit a 1024 ceiling and the 2 that had not
  # front-loaded their answer failed on truncation alone. A gate that fails
  # cases for running out of budget measures the budget, not the skill. The
  # diagnostic tiers keep 1024 (they are compared to each other, not gated).
  - id: openrouter:z-ai/glm-5.2
    config:
      max_tokens: 3072
      temperature: 0.0
      showThinking: false
      provider:
        allow_fallbacks: false
        quantizations:
          - fp8

  # --- MiniMax runner-up ------------------------------------------------------
  # The documented fallback candidate: if the GLM family is ever deprecated or
  # its backends degrade, minimax-m2.7 is the measured next-best open-weight
  # router (see BASELINE.md). Diagnostic-only; part of `make eval-routing-sweep`.
  # Requires OPENROUTER_API_KEY. Budget kept at 1024 for cross-row parity.
  - id: openrouter:minimax/minimax-m2.7
    config:
      max_tokens: 1024
      temperature: 0.0

defaultTest:
  # Pin the llm-rubric grading model explicitly. Without this, promptfoo
  # falls back to its built-in default grader selected by whichever API key
  # happens to be set in the environment — verdicts on borderline rubric
  # cases would then differ across machines. This pin freezes the de-facto
  # judge used for the recorded baselines (promptfoo 0.121.x's OpenAI
  # default at the time of the 2026-06 sweeps).
  #
  # 2026-08-13: routed through OpenRouter instead of OpenAI directly, so the
  # whole run bills to one vendor and needs only OPENROUTER_API_KEY. The MODEL
  # is unchanged, so every rate recorded before this date stays comparable —
  # but OpenRouter exposes only the floating `openai/gpt-5.5` tag, not the
  # dated `-2026-04-23` snapshot, so the judge can now roll silently under us.
  # Watch for a step change in borderline llm-rubric verdicts.
  #
  # showThinking:false is required, not cosmetic: promptfoo's openrouter
  # provider prepends "Thinking: <reasoning>" to the output whenever a model
  # returns a `reasoning` field, and the grader parses the FIRST JSON object it
  # finds in the response — reasoning prose containing a JSON-ish fragment
  # would be read as the verdict. No max_tokens: the previous judge passed
  # none, and matching that keeps the instrument identical.
  options:
    provider:
      id: openrouter:openai/gpt-5.5
      config:
        showThinking: false
  vars:
    # Inject the skill bundle (SKILL.md + all 8 references concatenated)
    # as the system message. This simulates the mid-conversation state where
    # the skill is loaded AND its required_reading has been satisfied —
    # which is what we want to test (does the agent route correctly given
    # the skill's full knowledge layer is in context?).
    #
    # Regenerate skill-bundle.md whenever SKILL.md or references/* change;
    # see tests/README.md for the one-line script.
    skill: file://skill-bundle.md

tests:
  - file://scenarios/bootstrap.yaml
  - file://scenarios/daily-ops.yaml
  - file://scenarios/interfaces.yaml
  - file://scenarios/parallel-envs.yaml
  - file://scenarios/troubleshoot.yaml
  - file://scenarios/troubleshoot-multiturn.yaml
  - file://scenarios/purge.yaml
  - file://scenarios/out-of-scope.yaml
  - file://scenarios/customize-actions.yaml
  - file://scenarios/author-in-project-sdk.yaml
  - file://scenarios/ide-integration.yaml
  - file://scenarios/multi-workshop-projects.yaml
