# The try-refresh loop: build into the try area, consume as try-<NAME>,
# fail fast, respect setup-base snapshot semantics, graduate to spread.

- description: Testing a built SDK goes through the try area
  vars:
    user: |
      The SDK builds clean now. How do I test it in a real workshop before publishing anything?
  assert:
    - type: contains
      value: sdkcraft try
    - type: contains
      value: "try-"
    - type: llm-rubric
      value: |
        The response drives the try loop: sdkcraft try packs into the try
        area, a test workshop consumes the SDK as try-<NAME> in its sdks:
        list, and the first launch runs with --verbose --wait-on-error to
        fail fast. Verification via workshop changes/tasks/info follows.
        Publishing before a healthy try run is the failure mode.

- description: Test workshop wires a consumer to the try SDK's slot by bare names
  vars:
    user: |
      My SDK `mir` exposes a mount slot `install`. Write the spread test's workshop.yaml.in that consumes the try build and wires a small in-project consumer SDK, `mir-consumer`, to that slot through its `mir` plug.
  assert:
    - type: contains
      value: try-mir
    - type: contains
      value: "mir:install"
    # A prefixed reference is a reserved-name launch error (issue #25).
    # Anchored on the YAML key, so prose naming the wrong form still passes.
    - type: javascript
      value: >-
        !/^\s*(?:-\s*)?(?:plug|slot|bind):\s*['"]?(?:try|project)-/m.test(output)
    - type: llm-rubric
      value: |
        The response's workshop.yaml.in lists `try-mir` and
        `project-mir-consumer` under sdks:, and its connections: entry
        pairs `mir-consumer:mir` with `mir:install` — bare SDK names,
        because the try-/project- prefixes belong in the sdks: list only
        and a prefixed reference fails the launch as a reserved SDK name.
        Writing `try-mir:install` or `project-mir-consumer:mir` in
        connections: is the failure mode. Placing the consumer under the
        job's own directory (tests/main/<job>/.workshop/mir-consumer/)
        and showing its sdk.yaml with a mount plug are pluses, NOT
        required.

- description: setup-base edits need remove plus launch, not refresh
  vars:
    user: |
      I fixed my setup-base hook, ran sdkcraft try again and workshop refresh — but the fix didn't apply. Why?
  assert:
    - type: contains-any
      value:
        - snapshot
        - remove
    - type: llm-rubric
      value: |
        The response explains that an applied refresh reuses the
        post-setup-base snapshot instead of re-running the hook, so after
        editing setup-base the workshop must be recreated (workshop
        remove, then launch) — the one legitimate remove+launch case in
        the loop.

- description: Failed refresh is diagnosed with the change and task record
  vars:
    user: |
      workshop refresh failed while applying my try SDK. Walk me through finding out which hook broke.
  assert:
    - type: contains
      value: workshop changes
    - type: contains-any
      value:
        - workshop tasks
        - --wait-on-error
    - type: llm-rubric
      value: |
        The response diagnoses from the recorded change: workshop changes
        to find the change ID, workshop tasks <ID> to locate the failing
        hook task, rerunning with --wait-on-error to pause in Waiting and
        shell in, then fixing the SDK SOURCE and rebuilding via
        sdkcraft clean && sdkcraft try (releasing the paused workshop
        with --abort). Guessing the cause without the task record is the
        failure mode.

- description: Snapshot invalidation cascades to later SDKs
  vars:
    user: |
      If my try SDK changes, do the other SDKs in the test workshop redo their setup?
  assert:
    - type: llm-rubric
      value: |
        The response states the cascade rule: a change to an SDK
        invalidates the post-setup-base snapshot for that SDK and every
        SDK listed BELOW it in the definition (those re-run setup-base on
        the next refresh); SDKs listed above it keep their snapshots.

- description: sketch-sdk is acknowledged but not driven
  vars:
    user: |
      Wouldn't workshop sketch-sdk be faster for iterating on my SDK?
  assert:
    - type: contains-any
      value:
        - interactive
        - $EDITOR
        - EDITOR
    - type: llm-rubric
      value: |
        The response acknowledges sketch-sdk as the human rapid-iteration
        tool but explains it needs an interactive $EDITOR session an agent
        cannot drive; the agent-drivable equivalent is editing the SDK
        source and going through the try loop. Mentioning that a command can
        be prototyped via workshop exec first is a plus, not required. It
        does not enumerate a step-by-step sketch-sdk session.

- description: A healthy SDK graduates to spread tests
  vars:
    user: |
      The try workshop comes up Ready and the SDK reports okay twice in a row. What's next before I call it done?
  assert:
    # icontains: a correct answer wrote "Spread regression tests" (Copilot,
    # 2026-10-23) and failed a case-sensitive `contains`.
    - type: icontains
      value: spread
    - type: llm-rubric
      value: |
        The response graduates the manual checks into spread smoke tests
        (tests/spread.yaml plus per-job task.yaml, run via sdkcraft test)
        and treats the README as part of done — rather than declaring the
        SDK finished on a single healthy launch.

# Capped, classified loop (iterate-and-debug.md Step 5) — borrowed from the
# per-class retry caps in rascheel/scheel-skills' snap-builder.
- description: A repeated hook failure stops at the cap with a Blocked report
  vars:
    user: |
      Third time now: workshop refresh parks in Waiting on my SDK's setup-project hook with the same "uv: command not found" error, even after I changed the PATH line in the hook twice. Just try another fix and refresh again?
  assert:
    - type: icontains
      value: blocked
    - type: icontains-any
      value:
        - workshop tasks
        - --abort
    - type: llm-rubric
      value: |
        The response does NOT propose a fourth blind fix-and-refresh. It
        recognises that the hook-failure class has used its fix budget
        (or that the same error after a fix means the fix was a guess),
        releases the parked workshop with --abort, and ends in a Blocked
        report: the failure class, attempts used against the cap, the
        `workshop tasks <ID>` output quoted verbatim (or a placeholder for
        it), a one-line hypothesis, and what the user should check next.
        Offering a concrete hypothesis to check (for example that
        setup-project's environment does not source the profile.d file
        that sets PATH) is a plus. Simply suggesting another PATH edit
        and refresh is the failure mode.

- description: A host LXD failure stops the loop without touching the SDK
  vars:
    user: |
      sdkcraft try worked, but workshop launch --verbose --wait-on-error fails straight away with "Failed to connect to LXD: dial unix /var/snap/lxd/common/lxd/unix.socket: connect: no such file or directory". What should I change in the SDK?
  assert:
    - type: icontains
      value: lxd
    - type: llm-rubric
      value: |
        The response classifies this as a host-toolchain failure, not an
        SDK bug: nothing in sdkcraft.yaml or the hooks should change, and
        the try loop stops here with a Blocked report (or an equivalent
        explicit stop) that names LXD as the cause and tells the user what
        to check on the host (for example whether the LXD snap/daemon is
        installed and running and the user is in the lxd group). Editing
        the SDK, or running snap refresh/remove on workshop or sdkcraft on
        the user's behalf, is the failure mode.
