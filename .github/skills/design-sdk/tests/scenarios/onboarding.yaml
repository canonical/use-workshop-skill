# SDK-repo onboarding: the template branching model, what lives on which
# branch, renovate anatomy, thin CI workflows, and the git sequence's
# confirmation discipline.

- description: The branching model splits template main from track branches
  vars:
    user: |
      Set up my SDK repo for automated releases. One track is fine for now.
  assert:
    - type: contains
      value: VERSION
    - type: contains-any
      value:
        - renovate
        - track
    - type: llm-rubric
      value: |
        The response works toward the template model: main as the
        template branch (renovate.json plus the renovate workflows, NO
        VERSION file) and one long-lived track branch (e.g. latest)
        carrying VERSION plus the build/upload workflows without the
        renovate workflows; renovate bumps VERSION via PRs against the
        track branch and merging triggers the upload. Entering the
        onboarding workflow's preflight (batched questions with
        recommendations about VERSION/adopt-info wiring, datasource,
        platforms) before touching the repo is an acceptable first step.
        The failure mode is proposing a DIFFERENT release model — VERSION
        kept on main, renovate workflows on the track branch, tags-only
        releases, or hand-rolled CI — or contradicting the template
        split where the response does describe it.

- description: Renovate workflows live on main only
  vars:
    user: |
      Should renovate.yml and renovate-check.yml also be on the 1.25 branch?
  assert:
    - type: llm-rubric
      value: |
        The response says no — the renovate workflows run from main only;
        track branches carry VERSION plus build.yml/upload.yml and have
        the renovate workflows removed (that removal is part of the
        onboarding git sequence). Duplicating renovate onto track
        branches is the failure mode.

- description: Multi-track renovate pins per-track allowed versions
  vars:
    user: |
      My tool keeps three supported minors, like Go. Write the renovate strategy for tracks 1.24, 1.25 and 1.26.
  assert:
    - type: contains
      value: baseBranchPatterns
    - type: contains-any
      value:
        - allowedVersions
        - packageRules
    - type: llm-rubric
      value: |
        The response uses baseBranchPatterns naming the three track
        branches and one packageRules entry per track pinning
        allowedVersions to that minor (e.g. /^1\.24\./ on 1.24), so each
        branch only ever receives its own minor's bumps via the custom
        regex manager on VERSION.

- description: The git sequence is confirmed per mutation, and push is the gate
  vars:
    user: |
      Run the branch surgery on my SDK repo now — set up main and the 1.0 track.
  assert:
    - type: llm-rubric
      value: |
        The response treats the branch surgery as a sequence of confirmed
        steps, never blind-run: either it shows the onboarding git
        sequence (commit everything except VERSION on main; branch the
        track from main; add VERSION on the track branch; remove the
        renovate workflows on the track branch) with per-mutation
        confirmation and pushing called out as the outward-facing step,
        or it runs the workflow's preflight gate first (repo facts,
        VERSION/adopt-info wiring, clean tree) while explicitly framing
        the upcoming sequence as per-mutation-confirmed. Failure modes:
        blind-running the sequence including push without any
        confirmation, or showing a sequence that deviates from the
        template model (e.g. VERSION kept on main).

- description: CI workflow files delegate to sdkcraft-actions
  vars:
    user: |
      Write the build workflow for pull requests into my SDK repo's track branches.
  assert:
    - type: contains
      value: sdkcraft-actions
    - type: llm-rubric
      value: |
        The response writes a THIN workflow: a pull_request trigger on the
        track-branch pattern and a job that `uses:`
        canonical/sdkcraft-actions' reusable build workflow — not a
        hand-rolled build script. The branch pattern matches the track
        style (e.g. "latest" or a quoted numeric pattern).

- description: Store credentials default to staging
  vars:
    user: |
      Wire the Store credentials into the upload workflow.
  assert:
    - type: contains-any
      value:
        - STAGING
        - staging
    - type: contains
      value: SDKCRAFT_STORE_CREDENTIALS
    - type: llm-rubric
      value: |
        The response points the upload workflow's secret at the STAGING
        credentials by default and treats the flip to the production
        secret (SDKCRAFT_STORE_CREDENTIALS_PROD) as an explicit,
        user-confirmed go-live decision — never wired to production from
        day one.

- description: VERSION is added on the track branch so forward-ports merge clean
  vars:
    user: |
      Set up tracks 1.24 and 1.25 for my SDK repo. Should VERSION go on main first and then get removed?
  assert:
    - type: contains-any
      value:
        - forward-port
        - forward port
        - merge base
        - merge-base
    - type: llm-rubric
      value: |
        The response says no: main never carries VERSION; each track
        branch is cut from main and adds its own VERSION in its own
        commit, so the merge base between main and the track has no
        VERSION and the forward-port main → track merges neither delete
        nor conflict on it. It connects this to the forward-port
        automation (forward-port.yml and/or the LONG_TERM_BRANCHES repo
        variable listing the track branches) as the reason the merge
        base matters; naming the sdkcraft-actions delegation is a bonus,
        not required. The failure mode is recommending that VERSION be
        committed on main and removed afterwards (e.g. branching from
        HEAD~1), or leaving VERSION on main.
