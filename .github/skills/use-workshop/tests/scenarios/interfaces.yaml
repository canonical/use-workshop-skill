- description: Expose a workshop service on the host (auto-connect tunnel)
  vars:
    user: |
      I have a service running on port 8080 inside my workshop. How do I make it reachable at localhost:8080 on my host?
  assert:
    - type: contains
      value: tunnel
    - type: contains-any
      value:
        - "system"
        - "system:"
    - type: contains-any
      value:
        - plugs
        - slots
    - type: contains
      value: workshop refresh
    - type: contains
      value: localhost:8080

- description: Reach a host service from inside the workshop (manual connect)
  vars:
    user: |
      I want code inside the workshop to connect to a Postgres server running on the host at localhost:5432. How do I wire that up?
  assert:
    - type: contains
      value: tunnel
    - type: contains
      value: workshop connect
    - type: contains
      value: workshop refresh
    - type: contains-any
      value:
        - manual
        - "system:"

- description: Plug conflict between two SDKs wanting the same mount target
  vars:
    user: |
      Two SDKs in my workshop both declare a plug for ~/.cache/foo and the launch fails with a conflict. How do I fix that?
  assert:
    - type: contains
      value: bind
    - type: contains-any
      value:
        - workshop launch
        - workshop refresh
    - type: contains-any
      value:
        - workshop connections
        - bind.

- description: Reassign a mount source to a different host directory
  vars:
    user: |
      How do I point an existing mount plug at a different host directory after the workshop is already launched?
  assert:
    - type: contains
      value: workshop remount
    - type: not-contains
      value: workshop launch

- description: User asks about ssh-agent forwarding
  vars:
    user: |
      I want my workshop to use the SSH keys from my host's ssh-agent so I can clone private repos. How?
  assert:
    - type: contains
      value: ssh-agent
    - type: contains
      value: workshop connect
    - type: contains-any
      value:
        - manual
        - "not auto"
        - "never auto"
        - "doesn't auto"
        - "does not auto"

- description: Expose host serial adapters via the custom-device interface
  vars:
    user: |
      I'm flashing an embedded board and need the workshop to see the host's serial adapters under /dev/ttyUSB*. Which interface covers that and how do I wire it?
  assert:
    - type: contains
      value: custom-device
    - type: contains
      value: subsystem
    - type: contains
      value: workshop connect
    - type: llm-rubric
      value: |
        The response picks the custom-device interface: a plug on the SDK with
        `interface: custom-device` and a `subsystem` attribute (tty or a
        similarly plausible subsystem for serial adapters), refreshed in, then
        connected manually with `workshop connect` — noting the interface
        never auto-connects (security). It does NOT misroute the request to
        the mount, tunnel, or GPU interface as the mechanism for device
        access.

- description: Set ownership and permissions on a mount target
  vars:
    user: |
      My SDK declares a mount plug whose target is /var/lib/mycache, and Workshop creates it owned by root. I need it owned by the workshop user and group-writable so my tools can write there. How do I set that on the mount plug?
  assert:
    - type: contains-any
      value:
        - uid
        - gid
        - mode
    - type: llm-rubric
      value: |
        The response sets ownership/permissions via the mount plug's `uid`/`gid`
        (1000 for the workshop user) and/or `mode` attributes. It conveys that
        these apply only when Workshop CREATES the target (an existing path
        keeps its ownership) — and because the target is under /var/lib (not
        /home/workshop, /project, or /run/user/1000), uid/gid would otherwise
        default to 0 (root), so they must be set explicitly. It does NOT claim
        a `chown` inside a hook is the only/primary way, and does NOT invent a
        non-existent attribute.

- description: Read a mount from another regular SDK's slot, not the system default
  vars:
    user: |
      I have a provider SDK that exposes a mount slot, and a consumer SDK with a mount plug. The plug keeps landing on the system mount instead of the provider's slot. How do I make the consumer read from the provider?
  assert:
    - type: contains
      value: connections
    - type: llm-rubric
      value: |
        The response explains that a regular-SDK mount slot is NOT auto-connected
        (mount auto-connect targets the system SDK's slot only), so the user must
        name the pairing explicitly with a top-level `connections:` entry pairing
        `consumer:<plug>` with `provider:<slot>`. It does NOT claim auto-connect
        will pick the regular-SDK slot, and does NOT misuse `bind:` (plug-to-plug)
        as the mechanism for pairing a plug to a slot.

- description: Narrow a custom-device plug to one USB adapter by vendor/product ID
  vars:
    user: |
      My custom-device plug uses `subsystem: tty`, but that exposes every serial adapter on the host. I only want the workshop to see my FTDI adapter, vendor 0403 product 6001. How do I restrict it?
  assert:
    - type: contains
      value: vendorid
    - type: contains
      value: productid
    - type: llm-rubric
      value: |
        The response narrows the custom-device plug with the `vendorid` and
        `productid` attributes (0.9.3+), keeping the values quoted as strings
        (`"0403"` / `"6001"`) so YAML doesn't mangle them. It notes that at
        least one of `subsystem`/`vendorid`/`productid` is required and that
        `productid` requires `vendorid`. It applies the change with
        `workshop refresh` and (since custom-device never auto-connects)
        `workshop connect`. It does NOT invent attributes like `vendor`,
        `product`, or `serial`, and does NOT route the request to a different
        interface.
