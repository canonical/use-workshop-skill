- description: VM workshop launch refused — the experimental opt-in (0.9.7)
  vars:
    user: |
      I put `confinement: virtual-machine` in my definition and `workshop launch dev` says the confinement is experimental. How do I actually launch it?
  assert:
    - type: contains
      value: workshop.experimental-vms=1
    - type: contains-any
      value:
        - snap restart workshop.workshopd
        - restart workshop.workshopd
    - type: not-contains
      value: snap remove
    - type: llm-rubric
      value: |
        The response gives BOTH opt-in commands — `sudo snap set workshop
        workshop.experimental-vms=1` and `sudo snap restart
        workshop.workshopd` — and makes clear the daemon restart is part of
        the opt-in rather than optional. It flags that VM confinement is
        experimental and that containers remain the default and supported
        choice. It does NOT invent a `workshop launch --vm` / `--experimental`
        flag, an environment variable the user should export by hand, or a
        config file to edit.

- description: Scaffolding a VM workshop with workshop init
  vars:
    user: |
      Is there a way to get `workshop init` to create a VM-backed workshop instead of a container?
  assert:
    - type: contains
      value: workshop init
    - type: contains
      value: "--vm"
    - type: contains-any
      value:
        - "confinement: virtual-machine"
        - confinement
    - type: llm-rubric
      value: |
        The response names the `--vm` flag on `workshop init` (0.9.7+) and
        explains that it writes `confinement: virtual-machine` into the
        generated definition, which can equally be added by hand. It says or
        implies that omitting the key means `container`. It should also warn
        that a VM is experimental and needs the snap opt-in before it will
        launch. It does NOT claim `--vm` exists on `workshop launch` or
        `workshop refresh`.

- description: Converting a launched container workshop to a VM
  vars:
    user: |
      My workshop "dev" is already running as a container. I edited the definition to say `confinement: virtual-machine` but `workshop refresh dev` fails with "confinement changed from container to virtual-machine". How do I apply it?
  assert:
    - type: contains
      value: workshop remove
    - type: contains
      value: workshop launch
    - type: not-contains
      value: workshop restore
    - type: llm-rubric
      value: |
        The response explains that confinement is fixed at launch, so refresh
        cannot change it, and that the only path is `workshop remove dev`
        followed by `workshop launch dev`. It warns that this discards the
        workshop's state and any manual `workshop connect` / `workshop
        remount` wiring. It does NOT suggest `workshop restore`, a snap
        restart, or another `workshop refresh` variant as the fix, and it does
        NOT claim the refresh would have worked with a flag.

- description: VM workshop that declares SDKs is refused
  vars:
    user: |
      Launching my VM workshop fails with "SDKs are currently unavailable for virtual machines", but the same definition works fine as a container. What's going on?
  assert:
    - type: contains-any
      value:
        - latest/edge
        - LXD
    - type: llm-rubric
      value: |
        The response explains that SDK support in a VM workshop depends on the
        host's LXD being able to mount shifted disks into a virtual machine,
        which in practice means installing LXD from `latest/edge`; the other
        way out is a VM definition that declares no SDKs at all. It does NOT
        claim VM workshops never support SDKs as a permanent rule, and it does
        NOT tell the user to reinstall or downgrade Workshop.

- description: Connections vanish after refreshing a VM workshop
  vars:
    user: |
      I connect a plug in my virtual-machine workshop and it works, but every `workshop refresh` leaves it disconnected again. In my container workshops the connection sticks. Is this a bug?
  assert:
    - type: contains
      value: workshop connect
    - type: not-contains
      value: workshop restore
    - type: llm-rubric
      value: |
        The response explains this is expected behavior, not a bug: under VM
        confinement Workshop skips auto-connect at launch AND at refresh and
        restores nothing, so the connection persistence that containers gained
        in 0.9.5 does not apply. The remedy is to re-run `workshop connect`
        after each refresh. It does NOT blame `--forget`, `workshop restore`,
        or a missing `connections:` entry, and it does NOT tell the user to
        file a bug or reinstall.

- description: base ubuntu@20.04 is deprecated, not rejected (0.9.7)
  vars:
    user: |
      My workshop.yaml says `base: ubuntu@20.04`. I read that 20.04 was dropped in 0.9.7 — will my workshop stop launching?
  assert:
    - type: contains-any
      value:
        - ubuntu@22.04
        - "22.04"
    - type: not-contains
      value: "does not launch"
    - type: llm-rubric
      value: |
        The response is accurate about the state of 20.04 in 0.9.7: the
        workshop STILL launches and refreshes, but each of those raises a
        warning that 20.04 is no longer supported and that the user should
        move to 22.04+ before the next release of Workshop. It advises editing
        `base:` to a supported value (`ubuntu@22.04`, `ubuntu@24.04`, or
        `ubuntu@26.04`) and running `workshop refresh`. It does NOT claim the
        base is already rejected, that launch fails today, or that validation
        errors out.
