- description: User wants two workshops in the same project
  vars:
    user: |
      My project has a Python backend and a Node frontend. I want a separate workshop for each, in the same git repo. How do I lay that out?
  assert:
    - type: contains
      value: .workshop/
    - type: contains-any
      value:
        - workshop launch
        - workshop list
    - type: llm-rubric
      value: |
        The response describes the multi-workshop layout: one definition
        file per workshop under `.workshop/`, with each file's basename
        matching its `name:` field (e.g., `.workshop/backend.yaml` with
        `name: backend`). It is acceptable for the response to demonstrate
        this invariant by example (showing two correctly-named files with
        matching `name:` fields) rather than stating it as an explicit rule
        — either form satisfies the requirement.

- description: User asks how to migrate from a single workshop.yaml
  vars:
    user: |
      I currently have a workshop.yaml at the project root and I want to add a second workshop alongside it. Can I just add another file?
  assert:
    - type: contains-any
      value:
        - "no"
        - "No"
        - "cannot"
        - "can't"
        - "rejects"
        - "refuses"
    - type: contains-any
      value:
        - "move"
        - "Move"
        - "rename"
        - "Rename"
        - "migrat"
        - "Migrat"
    - type: contains
      value: .workshop/
    - type: llm-rubric
      value: |
        The response explains that mixing a root-level `workshop.yaml` with
        `.workshop/*.yaml` files is not allowed, and that the user must
        first move the existing definition under `.workshop/` and rename it
        to match a workshop name (basename equal to `name:` field).

- description: User omits workshop name in a multi-workshop project
  vars:
    user: |
      My project has two workshops, "api" and "web". I tried `workshop refresh` but it complained. What do I do?
  assert:
    - type: contains-any
      value:
        - "workshop refresh api"
        - "workshop refresh web"
        - "workshop refresh <name>"
    - type: llm-rubric
      value: |
        The response conveys that, in a multi-workshop project, the
        workshop name is required (or at minimum: must be supplied) on
        every command — it cannot be omitted. The response demonstrates
        the fix by showing `workshop refresh` invoked with one of the
        named workshops (e.g., `workshop refresh api`). Phrasing flexibility
        is fine: "required", "must specify", "needs to know which one",
        "needs the name", and similar all satisfy the requirement.

- description: Cross-workshop networking within the same project (DNS by name)
  vars:
    user: |
      My "api" workshop runs a service on port 8080 inside it. My "web" workshop, in the same project, needs to call that service. How do I wire them up?
  assert:
    - type: contains-any
      value:
        - ".wp"
        - "api."
        - "by name"
        - hostname
    - type: contains-any
      value:
        - workshop info
        - workshop refresh
    - type: llm-rubric
      value: |
        The response tells the user that workshops in the same project reach
        each other by DNS name over the workshop network: `api`'s service is
        reachable from `web` at `http://api.<project>.wp:8080` (or the short
        name `http://api:8080` where the base supports the search domain), with
        NO host tunnel needed. It MAY note reading the exact name from
        `workshop info` (the `hostname:` line) and that an existing workshop
        needs one `workshop refresh` to activate it. It does NOT prescribe a
        host-bridged tunnel as the primary mechanism for this same-project
        case, and does NOT suggest a direct cross-workshop `workshop connect`
        (interface connections don't span workshops).

- description: A workshop needs a host-only service — still a tunnel
  vars:
    user: |
      One of my workshops needs to reach a Postgres server running directly on my host machine (not inside any workshop). DNS-by-name won't help here — how do I wire it?
  assert:
    - type: contains
      value: tunnel
    - type: contains
      value: workshop connect
    - type: contains-any
      value:
        - "system"
        - "system:"
    - type: llm-rubric
      value: |
        The response bridges to the host service with a tunnel — a plug on the
        consumer SDK and a slot on the `system` SDK pointing at the host port —
        applied with `workshop refresh` and wired with a manual `workshop
        connect`. That is the whole requirement: the user's prompt already
        concedes DNS-by-name won't help, so explicitly restating the contrast
        with same-project workshop-to-workshop DNS (or that a host process
        has no `.wp` name) is OPTIONAL extra credit, not required — do not
        penalize an otherwise-correct answer for leaving it implicit.

- description: User attempts a direct cross-workshop connect
  vars:
    user: |
      Why does `workshop connect api/backend:db web/consumer:db` fail? They're in the same project.
  assert:
    - type: contains-any
      value:
        - "rejected"
        - "not allowed"
        - "does not allow"
        - "do not allow"
        - "doesn't allow"
        - "not supported"
        - "doesn't work"
        - "does not work"
        - "cannot"
        - "can't"
        - "refuses"
        - "only exist within a single workshop"
        - "only within a single workshop"
        - "within the same workshop"
        - "in the same workshop"
        - "must both belong to the same workshop"
    - type: contains-any
      value:
        - "host"
        - "bridge"
        - "through the host"
        - tunnel
        - ".wp"
        - "by name"
        - hostname
        - DNS
