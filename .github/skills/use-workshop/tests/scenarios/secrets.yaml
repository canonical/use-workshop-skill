#
# The `secret` interface (Workshop 0.9.8+), user side: keyring → system slot →
# manual connect → workshopctl get-secret; the single-command --env route; the
# error table; exposure. Error strings and the connections:/bare-name facts
# were verified on a 0.9.8 host (see references/secrets.md).

- description: Provide an SDK's API key from the host keyring, end to end
  vars:
    user: |
      My workshop "dev" uses an SDK called `acme-cli`, and its README says it has a `secret` plug named `api-key` for my Acme API key. I don't want the key in workshop.yaml or anywhere in the repo. How do I set this up?
  assert:
    - type: contains
      value: secret-tool store
    - type: contains
      value: "interface: secret"
    - type: contains
      value: workshop connect
    - type: llm-rubric
      value: |
        The response walks the keyring route: store the key in the host
        keyring with `secret-tool store` (which prompts, so the value never
        appears on the command line); add a `secret` slot under the
        `system` SDK in the workshop definition carrying only lookup
        `attributes` (never the value); `workshop refresh`; then connect it
        explicitly with `workshop connect dev/acme-cli:api-key
        dev/system:<slot>` (or the one-argument form when the slot shares
        the plug's name). It verifies WITHOUT printing the key — e.g.
        `workshopctl get-secret acme-cli.api-key | wc -c` via `workshop
        exec`, or discarding stdout. It does NOT put the key in the
        definition, an action, or a `--env NAME=<value>` argument, and does
        NOT rely on a `connections:` entry to connect the secret.

- description: A secret pair in connections is not connected (0.9.8)
  vars:
    user: |
      I added a `secret` slot to the system SDK and listed `acme-cli:api-key` → `system:acme-key` under `connections:` in workshop.yaml. The refresh worked, but the tool says `secret plug "acme-cli.api-key" is not connected`. What did I miss?
  assert:
    - type: contains
      value: workshop connect
    - type: llm-rubric
      value: |
        The response explains that the `secret` interface never connects
        automatically, and that a `connections:` entry cannot connect it
        either — `connections:` only steers auto-connection, which the
        secret policy forbids, so the entry is accepted but leaves the plug
        unconnected. The fix is an explicit `workshop connect
        <ws>/acme-cli:api-key <ws>/system:acme-key`, done once (it persists
        across refreshes while the slot's lookup stays the same). Removing
        the now-useless `connections:` entry is a plus. It does NOT
        suggest restarting the daemon, re-launching, or putting the value
        in the definition.

- description: Locked keyring — unlock and retry (exit 2)
  vars:
    user: |
      `workshop exec dev -- workshopctl get-secret acme-cli.api-key >/dev/null` prints `cannot retrieve secret for plug "acme-cli.api-key": unlock the secret provider and try again`. The plug is connected. What now?
  assert:
    - type: llm-rubric
      value: |
        The response says the host keyring (the Secret Service collection,
        e.g. GNOME Keyring's login keyring) is locked and that the user
        must unlock it in their desktop session, then run the command
        again — Workshop does not unlock it or prompt for a password
        itself. It does NOT tell the user to reconnect the plug, edit the
        slot, refresh, or re-store the secret as the fix, and does NOT
        print the secret to check it.

- description: No secret found — fix the slot, refresh, and reconnect
  vars:
    user: |
      `workshopctl get-secret acme-cli.api-key` says `no secret found for plug "acme-cli.api-key"`. I stored the key with `secret-tool store --label="Acme" service acme account personal` but my slot says `service: acme` and `account: work`. I'll fix the slot — anything else?
  assert:
    - type: contains
      value: workshop refresh
    - type: contains
      value: workshop connect
    - type: llm-rubric
      value: |
        The response confirms the slot's attributes must match the stored
        item (here `account: personal`, or re-store the item under
        `account: work`), and — the key point — that after editing the
        slot and running `workshop refresh` the user must CONNECT THE PLUG
        AGAIN, because a refresh that changes a secret slot's `attributes`
        or `collection` drops the connection (with a warning shown by
        `workshop warnings`). Checking the match with `secret-tool search`
        while discarding stdout is a plus. It does NOT echo the secret.

- description: Multiple secrets match — refine the slot (exit 4)
  vars:
    user: |
      I get `multiple secrets match plug "acme-cli.api-key"; refine the secret slot`. My slot only has `service: acme`.
  assert:
    - type: llm-rubric
      value: |
        The response explains that more than one keyring item carries all
        the slot's attributes, so the lookup is ambiguous (it must match
        exactly one). The fix is to add an attribute to the slot that only
        the intended item carries (e.g. `account: …`) — or delete the extra
        items from the keyring — then `workshop refresh` and connect the
        plug again because the changed lookup drops the connection. Listing
        the matches with `secret-tool search --all service acme` while
        discarding stdout (so values aren't printed) is a plus. It does NOT
        suggest a `collection` value as the only fix without explaining it,
        and does not print secrets.

- description: One-off command with an API key — --env NAME filled from the keyring
  vars:
    user: |
      I just want to run `pytest tests/integration` once inside my workshop with my OPENAI_API_KEY, which is in my GNOME keyring under service openai, account work. No permanent setup. What's the safe way?
  assert:
    - type: contains
      value: "--env OPENAI_API_KEY"
    - type: contains
      value: secret-tool lookup
    - type: llm-rubric
      value: |
        The response uses the single-command route: fill the variable
        from the keyring in an assignment that prefixes the command and
        pass only the NAME to `--env`, e.g. `OPENAI_API_KEY=$(secret-tool
        lookup service openai account work) workshop exec --env
        OPENAI_API_KEY <workshop> -- pytest tests/integration`. It says
        (or clearly implies) never to type the value as
        `--env OPENAI_API_KEY=<value>` because it lands in shell history
        and the process list. It does NOT add anything to the workshop
        definition, an action, or a shell profile for this.

- description: Who can read a connected secret — the whole workshop
  vars:
    user: |
      If I connect my GitHub token to the `acme-cli` SDK's secret plug, is it only that SDK that can read it? I'm about to let a coding agent run autonomously in the same workshop.
  assert:
    - type: llm-rubric
      value: |
        The response says no: while the plug is connected, ANY process in
        the workshop can request the secret (via `workshopctl get-secret
        acme-cli.<plug>`), not just the declaring SDK. So before the
        autonomous agent starts, disconnect the secret plug (and other
        interfaces it doesn't need, such as ssh-agent) unless the agent is
        meant to use it. It does NOT claim the secret is scoped to one SDK
        or one process. Extra correct detail — that everything runs as the
        same `workshop` user, or that disconnecting cannot take back a value
        a process already received — is a plus, not a requirement.

- description: Secret slot only on the system SDK
  vars:
    user: |
      I tried to put the `secret` slot under my own `acme-cli` SDK entry in workshop.yaml, and refresh fails with "secret interface slots are only supported by the system SDK". Where does it go?
  assert:
    - type: contains
      value: system
    - type: llm-rubric
      value: |
        The response moves the slot under the `system` SDK entry in the
        workshop definition (an `sdks:` item with `name: system` and a
        `slots:` map) — secret slots exist only there, while the `acme-cli`
        SDK keeps its `secret` plug. It shows the slot carrying only
        `interface: secret` plus `attributes` (and optionally
        `collection`), never the value, and says to connect the plug
        manually after the refresh.

- description: In-project SDK secret — bare name in get-secret
  vars:
    user: |
      My in-project SDK `.workshop/tools/` declares a `secret` plug `api-key`, the workshop lists it as `project-tools`, and I connected it. But `workshop exec dev -- workshopctl get-secret project-tools.api-key` fails with "invalid SDK name". What's the right identifier?
  assert:
    - type: contains
      value: tools.api-key
    - type: llm-rubric
      value: |
        The response says the identifier uses the SDK's bare name —
        `tools.api-key` — because the `project-` prefix only marks where the
        `sdks:` entry comes from (the same holds for `try-` SDKs). If it
        shows a `get-secret` command to run, that command is value-safe
        (piped to `wc -c` or with stdout discarded) — showing no command at
        all is fine, since the user asked only for the identifier. It does
        NOT tell the user to rename the SDK or re-declare the plug.
