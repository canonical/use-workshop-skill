name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Free checks — run on every push/PR. Same entry point as `make check`.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Static checks (doc paths, bundle regen, YAML parse, shellcheck)
        run: make -C .github/skills/use-workshop/tests check
      - name: REUSE lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Free smoke test of the toolchain actions the paid eval-routing job relies
  # on (setup-node, upload-artifact), so their pinned versions are exercised on
  # every push/PR. Without it those two bumps would only ever run in the paid,
  # workflow_dispatch-only job below. No API spend — just the Node toolchain.
  eval-routing-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Verify Node toolchain and stage a marker
        run: |
          node --version
          npm --version
          node --version > eval-routing-smoke.txt
      - name: Upload marker artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-routing-smoke
          path: eval-routing-smoke.txt
          retention-days: 1

  # Routing eval — paid (~$7-8/run), so manual-only via workflow_dispatch.
  # Requires the ANTHROPIC_API_KEY repository secret. Compare the result
  # against tests/BASELINE.md before merging skill-content changes.
  eval-routing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Install promptfoo
        run: npm install -g promptfoo@0.121.9
      - name: Routing eval (Sonnet 4.6 baseline)
        run: make -C .github/skills/use-workshop/tests eval-routing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Upload result summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routing-eval-results
          path: .github/skills/use-workshop/tests/results/
