name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Free checks — run on every push/PR. Same entry point as `make check`.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Static checks, use-workshop (doc paths, bundle regen, YAML parse, shellcheck)
        run: make -C .github/skills/use-workshop/tests check
      - name: Static checks, onboard-workshop (shared manifests, bundle regen, YAML keys, hooks)
        run: make -C .github/skills/onboard-workshop/tests check
      - name: Static checks, design-sdk (shared manifests, sdkcraft YAML keys, hooks, templates)
        run: make -C .github/skills/design-sdk/tests check
      - name: Syntax-check shared and reconstruction JS providers
        run: |
          for f in .github/skills/_testlib/*.js .github/skills/*/tests/reconstruction/*.js; do
            node --check "$f"
          done
      - name: REUSE lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Free smoke test of the toolchain actions the paid eval-routing job relies
  # on (setup-node, upload-artifact), so their pinned versions are exercised on
  # every push/PR. Without it those two bumps would only ever run in the paid,
  # workflow_dispatch-only job below. No API spend — just the Node toolchain.
  eval-routing-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify Node toolchain and stage a marker
        run: |
          node --version
          npm --version
          node --version > eval-routing-smoke.txt
      - name: Upload marker artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-routing-smoke
          path: eval-routing-smoke.txt
          retention-days: 1

  # Routing eval — Lane 1 (see TESTING.md), SUSPENDED since 2026-10-19: the
  # OpenRouter budget is gone. Kept runnable (manual-only via
  # workflow_dispatch) so the lane can resume without archaeology; do not
  # dispatch it until the OPENROUTER_API_KEY account is funded again.
  #
  # use-workshop ONLY: GLM-5.2 as candidate and gpt-5.5 as the llm-rubric
  # judge, both through OpenRouter (~$1.41/run). OPENROUTER_API_KEY is the
  # only secret this job (and this repo) needs.
  #
  # The live gates are local-only by design — the claude subscription lane
  # (all three suites' `make eval-routing`) and the Copilot lane
  # (`make eval-routing-copilot`) need a CLI login a runner does not have.
  eval-routing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install promptfoo
        # Aligned with the locally-verified version (see TESTING.md) so CI
        # and local runs measure with the same client.
        run: npm install -g promptfoo@0.121.17
      - name: Routing eval (use-workshop, GLM-5.2, suspended lane)
        run: make -C .github/skills/use-workshop/tests eval-routing-glm
        env:
          # Covers both the candidate and the judge; run-routing.sh preflights
          # the judge and exits 2 if its provider's key is missing.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Upload result summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: routing-eval-results-use-workshop
          path: .github/skills/use-workshop/tests/results/
