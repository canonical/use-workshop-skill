description: |
  Agentic end-to-end eval for the onboard-workshop skill.
  Each task spawns `claude -p` in an isolated sandbox where BOTH skills
  (onboard-workshop + use-workshop) are installed, and asserts on the
  transcript, the generated definition files, and captured workshop state.
  onboard-mini-node drives a real LXD workshop (slow, side-effectful);
  honesty-gate must NOT create anything, so it runs without touching LXD.
  Default model is Sonnet 4.6; per-task overrides via vars.

prompts:
  # Each task supplies its own `task` var; this prompt template is just a
  # passthrough so promptfoo's pipeline accepts the test cases.
  - "{{task}}"

providers:
  # Shared provider (see .github/skills/_testlib/). Skills resolve from the
  # provider's own location — this retires the five-levels repo_root hack the
  # first suite invocation tripped over. Auth defaults to the claude CLI
  # subscription login (EVAL_AUTH=api opts into --bare + ANTHROPIC_API_KEY,
  # where max_budget_usd is the spend rail).
  - id: file://../../../_testlib/provider-agentic.js
    config:
      skills: [onboard-workshop, use-workshop]
      model: claude-sonnet-4-6
      agent_timeout_ms: 900000
      max_budget_usd: 3
      capture_generated_files: true
      sandbox_prefix: onboard-agentic-

defaultTest:
  options:
    cache: false
    # Pin llm-rubric grading to the local claude CLI judge (see the sibling
    # config's comment for why an unpinned grader is a problem).
    provider: file://../../../_testlib/provider-judge-cli.js

tests:
  - file://tasks/onboard-mini-node.yaml
  - file://tasks/honesty-gate.yaml
