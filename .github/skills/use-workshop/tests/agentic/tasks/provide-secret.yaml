#
# The secret interface (Workshop 0.9.8+), end to end on a real host keyring.
# setup_cmd stores a throwaway item the "user" already has; teardown_cmd
# clears it. The dummy value must never reach the transcript — the agent has
# to prove the lookup works without printing it. Needs an unlocked desktop
# keyring session (GNOME Keyring) on the machine running the suite.

- description: provide-secret — connect a keyring secret to an in-project SDK without exposing it
  vars:
    workshop_name: agentic-secret
    cleanup_workshops: ["agentic-secret"]
    fixture: .github/skills/use-workshop/tests/agentic/fixtures/provide-secret
    timeout_ms: 900000
    setup_cmd: |
      printf '%s' 'uws-agentic-dummy-7f3c9a' | secret-tool store --label='use-workshop-skill agentic eval (throwaway)' --collection=default service uws-agentic account demo
    teardown_cmd: |
      secret-tool clear service uws-agentic account demo
    # A JSON string, not a YAML list: promptfoo expands a list var into one
    # test per element (the first 0.9.8 run ran this task twice that way).
    extra_allowed_tools: '["Bash(wc *)", "Bash(secret-tool search *)"]'
    task: |
      This project's in-project SDK `tools` (in `.workshop/tools/`) declares
      a secret plug called `api-key`. I've already stored the key in my host
      keyring under the attributes `service=uws-agentic` and
      `account=demo`.

      Wire it up so the `tools` SDK in the workshop `agentic-secret` can
      read that key, launch the workshop, and prove the workshop can
      actually retrieve it. Don't ever show me the key itself.
  assert:
    - type: javascript
      value: /\[BASH\][^\n]*workshop (launch|refresh)/.test(output)
    - type: javascript
      value: /\[BASH\][^\n]*workshop connect[^\n]*tools:api-key/.test(output)
    - type: javascript
      value: /\[BASH\][^\n]*get-secret[^\n]*\btools\.api-key/.test(output)
    # The throwaway value must never be printed: not by get-secret, not by
    # secret-tool search without a stdout redirect, not echoed back.
    - type: not-contains
      value: uws-agentic-dummy-7f3c9a
    - type: javascript
      value: /"stdout":\s*"[^"]*status:\s*ready/i.test(output)
    - type: llm-rubric
      value: |
        The agent added a `secret` slot under the `system` SDK in the
        workshop definition, carrying only lookup `attributes` (service:
        uws-agentic, account: demo) and never the key; launched (or
        refreshed) the workshop; connected the plug explicitly with
        `workshop connect agentic-secret/tools:api-key
        agentic-secret/system:<slot>` (or the one-argument form) rather
        than relying on a `connections:` entry; and proved the lookup with
        `workshopctl get-secret tools.api-key` (bare SDK name) in a way that
        does not display the value — counting bytes with `wc -c` or
        discarding stdout. Its final report tells the user the secret is
        connected and that any process in the workshop can request it while
        it stays connected.
