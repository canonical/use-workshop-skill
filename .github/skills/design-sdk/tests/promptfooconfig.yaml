description: |
  Routing and behavior eval for the design-sdk skill.
  Each scenario file under `scenarios/` contributes test cases that simulate
  a user prompt; the skill bundle (SKILL.md + references + workflows +
  borrowed sibling files) is the chat system message via prompt.json.
  Assertions check verb dispatch ($ARGUMENTS routes directly; bare software
  names enter the `new` chain), design doctrine (parts-vs-hooks, interface
  policy, the systemd service pattern), generation invariants (adopt-info +
  VERSION, no stage-packages, hook contract), the try-refresh loop,
  SDK-repo onboarding (template main + track branches), and sibling
  fencing. scenarios/skill-selection.yaml overrides vars.skill with
  skill-selection-context.md (every installed skill's frontmatter) to test
  3-way cross-skill routing.

  This suite's gate runs on the SUBSCRIPTION lane from day one: Sonnet via
  the local claude CLI login as the candidate, the local claude judge for
  llm-rubric grading — $0, no API keys, same pair as the sibling gates so
  rates stay comparable across suites. There is no HTTP lane here.

prompts:
  - file://prompt.json

providers:
  # Local claude CLI candidate (see _testlib/provider-routing-cli.js for the
  # delivery mechanics: system prompt via --system-prompt-file, user message
  # on stdin, tool-less scratch cwd).
  - id: file://../../_testlib/provider-routing-cli.js
    label: claude-cli:claude-sonnet-4-6
    config:
      model: claude-sonnet-4-6
      timeout_ms: 240000

defaultTest:
  options:
    # Local claude judge — grading also runs on the subscription login. The
    # driver additionally passes --grader with the same file, belt and
    # braces. Baselines are per (candidate, judge) pair.
    provider: file://../../_testlib/provider-judge-cli.js
  vars:
    # The bundle simulates the mid-conversation state where the skill is
    # loaded AND its required_reading (incl. borrowed sibling files) has
    # been satisfied. Regenerated by scripts/regenerate-bundle.sh.
    skill: file://skill-bundle.md

tests:
  - file://scenarios/dispatch.yaml
  - file://scenarios/design.yaml
  - file://scenarios/generate.yaml
  - file://scenarios/iterate.yaml
  - file://scenarios/onboarding.yaml
  - file://scenarios/honesty-bestpractice.yaml
  - file://scenarios/skill-selection.yaml
  - file://scenarios/out-of-scope.yaml
