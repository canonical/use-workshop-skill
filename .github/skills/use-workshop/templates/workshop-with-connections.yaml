# Workshop definition with explicit interface wiring.
# Two examples below: a tunnel exposing a workshop service to the host
# (auto-connects), and an explicit `connections:` entry for non-default wiring.

name: dev
base: ubuntu@24.04
sdks:

  # Service inside the workshop publishes a TCP port via tunnel slot.
  - name: <service-sdk>
    slots:
      api:
        interface: tunnel
        endpoint: localhost:8080      # service port inside the workshop

  # System SDK exposes a matching plug; auto-connects because the plug is
  # on `system`, the slot is on a regular SDK, and the names match.
  - name: system
    plugs:
      api:
        interface: tunnel
        endpoint: localhost:8080      # port on the host

  # A provider SDK exposing a mount slot. The workshop-source directory must
  # already exist when the connection is established — Workshop does not
  # create it (an SDK ships it, or a hook creates it).
  - name: <data-sdk>
    slots:
      data:
        interface: mount
        workshop-source: $SDK/data    # path inside the workshop

  # The consumer SDK with the matching mount plug.
  - name: <consumer-sdk>
    plugs:
      data:
        interface: mount
        workshop-target: /home/workshop/data

# Explicit connection: ties a plug to a specific slot when auto-connect
# would not pick the right target (a regular-SDK mount slot never
# auto-connects). Note: `connections:` entries still pass the interface's
# auto-connect policy — manual-only interfaces (ssh-agent, camera, desktop,
# custom-device) cannot be wired here and need `workshop connect`.
connections:
  - plug: <consumer-sdk>:data
    slot: <data-sdk>:data
