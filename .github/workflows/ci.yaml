name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Free checks — run on every push/PR. Same entry point as `make check`.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Static checks, use-workshop (doc paths, bundle regen, YAML parse, shellcheck)
        run: make -C .github/skills/use-workshop/tests check
      - name: Static checks, onboard-workshop (shared manifests, bundle regen, YAML keys, hooks)
        run: make -C .github/skills/onboard-workshop/tests check
      - name: REUSE lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Free smoke test of the toolchain actions the paid eval-routing job relies
  # on (setup-node, upload-artifact), so their pinned versions are exercised on
  # every push/PR. Without it those two bumps would only ever run in the paid,
  # workflow_dispatch-only job below. No API spend — just the Node toolchain.
  eval-routing-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify Node toolchain and stage a marker
        run: |
          node --version
          npm --version
          node --version > eval-routing-smoke.txt
      - name: Upload marker artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-routing-smoke
          path: eval-routing-smoke.txt
          retention-days: 1

  # Routing eval — paid, so manual-only via workflow_dispatch. Compare the
  # result against the per-skill tests/BASELINE.md before merging skill-content
  # changes. The `skill` input picks which suite(s) to run.
  #
  # The two suites bill differently as of 2026-08-13:
  #   use-workshop     GLM-5.2 candidate + gpt-5.5 judge, both via OpenRouter
  #                    (~$4.50/run) — needs OPENROUTER_API_KEY only.
  #   onboard-workshop Sonnet 4.6 candidate + gpt-5.5 judge direct from OpenAI
  #                    (~$7-8/run) — needs ANTHROPIC_API_KEY + OPENAI_API_KEY.
  # All three secrets are passed because the matrix runs both.
  eval-routing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: [use-workshop, onboard-workshop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install promptfoo
        run: npm install -g promptfoo@0.121.9
      - name: Routing eval (pinned baseline)
        run: make -C .github/skills/${{ matrix.skill }}/tests eval-routing
        env:
          # run-routing.sh preflights the pinned llm-rubric judge and exits 2
          # if the key for the judge's provider is missing.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Upload result summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routing-eval-results-${{ matrix.skill }}
          path: .github/skills/${{ matrix.skill }}/tests/results/
