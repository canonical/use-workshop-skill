description: |
  Routing and behavior eval for the onboard-workshop skill.
  Each scenario file under `scenarios/` contributes test cases that simulate
  a user prompt; the skill bundle (SKILL.md + references + workflows +
  borrowed sibling files) is the chat system message via prompt.json.
  Assertions check the honesty gate (verdict before generation, gaps admitted),
  evidence-based analysis, SDK selection order, explicit recommendations on
  every question, and the action proof loop. scenarios/skill-selection.yaml
  overrides vars.skill with skill-selection-context.md (both skills'
  frontmatter only) to test cross-skill routing.

prompts:
  - file://prompt.json

providers:
  # Primary baseline. Listed first so scripts/run-routing.sh defaults to it.
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      max_tokens: 1024
      temperature: 0.0
  # Clarity diagnostic — Haiku failures on a well-written skill usually
  # indicate ambiguity in the skill rather than model weakness.
  - id: anthropic:messages:claude-haiku-4-5
    config:
      max_tokens: 1024
      temperature: 0.0
  # Headroom check — Opus failures usually indicate a missing/wrong skill
  # fact, not a model capability gap.
  - id: anthropic:messages:claude-opus-4-7
    config:
      max_tokens: 1024
      temperature: 0.0

defaultTest:
  # Same pinned llm-rubric judge as the sibling suite (see the rationale
  # there); requires OPENAI_API_KEY.
  options:
    provider: openai:gpt-5.5-2026-04-23
  vars:
    # The bundle simulates the mid-conversation state where the skill is
    # loaded AND its required_reading (incl. borrowed sibling files) has been
    # satisfied. Regenerated by scripts/regenerate-bundle.sh.
    skill: file://skill-bundle.md

tests:
  - file://scenarios/analyze.yaml
  - file://scenarios/feasibility-honesty.yaml
  - file://scenarios/interview.yaml
  - file://scenarios/sdk-selection.yaml
  - file://scenarios/generate.yaml
  - file://scenarios/verify-actions.yaml
  - file://scenarios/skill-selection.yaml
  - file://scenarios/out-of-scope.yaml
