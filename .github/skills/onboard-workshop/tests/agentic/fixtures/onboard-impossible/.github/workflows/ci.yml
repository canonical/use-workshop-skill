name: CI
on: [push]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project Fjordline.xcodeproj -scheme Fjordline build
      - run: xcodebuild -project Fjordline.xcodeproj -scheme Fjordline test -destination 'platform=iOS Simulator,name=iPhone 16'
