description: |
  Routing and behavior eval for the onboard-workshop skill.
  Each scenario file under `scenarios/` contributes test cases that simulate
  a user prompt; the skill bundle (SKILL.md + references + workflows +
  borrowed sibling files) is the chat system message via prompt.json.
  Assertions check the honesty gate (verdict before generation, gaps admitted),
  evidence-based analysis, SDK selection order, explicit recommendations on
  every question, and the action proof loop. scenarios/skill-selection.yaml
  overrides vars.skill with skill-selection-context.md (both skills'
  frontmatter only) to test cross-skill routing.

  This suite's gate runs on the SUBSCRIPTION lane: Sonnet via the local
  claude CLI login as the candidate, the local claude judge for llm-rubric
  grading — $0, no API keys. The Anthropic HTTP tiers and the OpenAI judge
  were retired 2026-08-20 (the API path cost ~$4/run and two keys); the
  2026-08-13 GLM-5.2 diagnostic measured 50/53, so an OpenRouter migration
  was rejected and Sonnet fidelity kept — see BASELINE.md.

prompts:
  - file://prompt.json

providers:
  # Local claude CLI candidate (see _testlib/provider-routing-cli.js for the
  # delivery mechanics: system prompt via --system-prompt-file, user message
  # on stdin, tool-less scratch cwd).
  - id: file://../../_testlib/provider-routing-cli.js
    label: claude-cli:claude-sonnet-4-6
    config:
      model: claude-sonnet-4-6
      timeout_ms: 240000

defaultTest:
  options:
    # Local claude judge — grading also runs on the subscription login. The
    # driver additionally passes --grader with the same file, belt and braces.
    # Scores from this judge are NOT comparable with the retired
    # openai:gpt-5.5-2026-04-23 judge's: baselines are per (candidate, judge)
    # pair.
    provider: file://../../_testlib/provider-judge-cli.js
  vars:
    # The bundle simulates the mid-conversation state where the skill is
    # loaded AND its required_reading (incl. borrowed sibling files) has been
    # satisfied. Regenerated by scripts/regenerate-bundle.sh.
    skill: file://skill-bundle.md

tests:
  - file://scenarios/dispatch.yaml
  - file://scenarios/analyze.yaml
  - file://scenarios/feasibility-honesty.yaml
  - file://scenarios/interview.yaml
  - file://scenarios/sdk-selection.yaml
  - file://scenarios/generate.yaml
  - file://scenarios/verify-actions.yaml
  - file://scenarios/skill-selection.yaml
  - file://scenarios/out-of-scope.yaml
