- description: First-time setup, user has cloned a repo with workshop.yaml
  vars:
    user: |
      I just cloned a repo and it has a workshop.yaml at the root. What do I run to get started?
  assert:
    - type: contains
      value: workshop launch
    - type: contains-any
      value:
        - workshop info
        - workshop list
    - type: not-contains
      value: workshop start
    - type: not-contains
      value: sdkcraft

- description: Greenfield project, user wants a Go-based workshop
  vars:
    user: |
      I want to set up a workshop for a Go project. What's the minimal workshop.yaml I need and how do I launch it?
  assert:
    - type: contains-all
      value:
        - "name:"
        - "base:"
        - "sdks:"
    - type: contains
      value: ubuntu@
    - type: contains
      value: workshop launch
    - type: not-contains
      value: sudo snap remove

- description: User wants to know what to commit and what to gitignore
  vars:
    user: |
      I'm setting up a workshop in a git repo. What files should I commit and which ones should I add to .gitignore?
  assert:
    - type: contains-any
      value:
        - .gitignore
        - .workshop.lock
        - "*.lock"
    - type: contains-any
      value:
        - workshop.yaml
        - .workshop/
    - type: not-contains
      value: sdkcraft

- description: User wants to discover SDKs first
  vars:
    user: |
      How do I find out what SDKs are available for adding a new tool to my workshop?
  assert:
    - type: contains-any
      value:
        - sdk find
        - sdk info
    - type: not-contains
      value: sdkcraft

- description: User asks how to confirm a launch worked
  vars:
    user: |
      I just ran workshop launch. How do I check it's actually ready and the project is mounted?
  assert:
    - type: contains-any
      value:
        - workshop info
        - workshop list
    - type: contains-any
      value:
        - /project
        - workshop exec
        - workshop shell

- description: User wants to scaffold a definition from the CLI (workshop init)
  vars:
    user: |
      I want to create a workshop definition called dev for a Go project straight from the CLI, without hand-writing any YAML. What do I run?
  assert:
    - type: contains
      value: workshop init
    - type: contains
      value: --sdks
    - type: contains-any
      value:
        - .workshop/dev.yaml
        - .workshop/
    - type: contains
      value: workshop launch
    - type: not-contains
      value: sdkcraft

- description: User asks whether workshop init can set up actions and connections
  vars:
    user: |
      Can `workshop init` set up my actions: block and a connection to another workshop for me, or does it only do the basics?
  assert:
    - type: contains
      value: workshop init
    - type: contains-any
      value:
        - actions
        - connections
    - type: llm-rubric
      value: |
        The response makes clear that `workshop init` scaffolds the base
        image and SDKs only — it does NOT generate an `actions:` block,
        `connections:`, or plug/slot grafts. It explains those must be added
        afterward by editing the generated `.workshop/<name>.yaml` (or by
        starting from a templates/ file). It does NOT invent `workshop init`
        flags that create actions or connections.

- description: User asks to mix a root workshop.yaml with a workshop init definition
  vars:
    user: |
      I already have a workshop.yaml at the project root. Can I also run `workshop init backend --sdks node` to add a second definition alongside it?
  assert:
    - type: contains-any
      value:
        - reject
        - "can't"
        - cannot
        - "won't"
        - not allowed
        - mix
    - type: llm-rubric
      value: |
        The response explains that a project cannot mix a root workshop.yaml
        with .workshop/<name>.yaml files — Workshop rejects this layout. To
        run multiple workshops you must migrate the root workshop.yaml into
        the .workshop/<name>.yaml form first (so all definitions live under
        .workshop/). It does not tell the user they can simply keep both.

- description: Bare workshop init and in-project SDK references (0.9.5 forms)
  vars:
    user: |
      Can `workshop init` give me a bare ubuntu@24.04 definition with no SDKs at all? And can it reference the in-project SDK I keep under .workshop/tools/?
  assert:
    - type: contains
      value: workshop init
    - type: contains
      value: project-tools
    - type: llm-rubric
      value: |
        The response answers yes to both (Workshop 0.9.5+): `--sdks` is
        optional, so a bare `workshop init <name>` scaffolds a base-only
        definition (and `--base` defaults to ubuntu@24.04, so it can be
        omitted too); and `--sdks project-tools` puts the in-project SDK
        reference into the scaffolded definition. (Mentioning that
        try-<name> works the same way is a plus, NOT required — the user
        asked only about their in-project SDK.) It keeps the boundary
        honest: init writes the definition file only — the SDK's directory
        (.workshop/tools/ with sdk.yaml and hooks) is authored separately,
        and actions/connections/grafts still come from editing the file or
        a template. It does NOT claim these forms need an older/newer flag
        or invent extra scaffolding flags.
