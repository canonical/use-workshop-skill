name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Free checks — run on every push/PR. Same entry point as `make check`.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Static checks, use-workshop (doc paths, bundle regen, YAML parse, shellcheck)
        run: make -C .github/skills/use-workshop/tests check
      - name: Static checks, onboard-workshop (shared manifests, bundle regen, YAML keys, hooks)
        run: make -C .github/skills/onboard-workshop/tests check
      - name: Syntax-check shared JS providers
        run: |
          for f in .github/skills/_testlib/*.js; do node --check "$f"; done
      - name: REUSE lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Free smoke test of the toolchain actions the paid eval-routing job relies
  # on (setup-node, upload-artifact), so their pinned versions are exercised on
  # every push/PR. Without it those two bumps would only ever run in the paid,
  # workflow_dispatch-only job below. No API spend — just the Node toolchain.
  eval-routing-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify Node toolchain and stage a marker
        run: |
          node --version
          npm --version
          node --version > eval-routing-smoke.txt
      - name: Upload marker artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-routing-smoke
          path: eval-routing-smoke.txt
          retention-days: 1

  # Routing eval — Lane 1 of the three-lane doctrine (see TESTING.md): the
  # only paid eval, so manual-only via workflow_dispatch. Compare the result
  # against tests/BASELINE.md before merging skill-content changes.
  #
  # use-workshop ONLY. That suite's gate runs GLM-5.2 as candidate and gpt-5.5
  # as the llm-rubric judge, both through OpenRouter (~$1.41/run), so
  # OPENROUTER_API_KEY is the only secret this job (and this repo) needs.
  #
  # onboard-workshop is deliberately NOT here: its routing gate is the
  # subscription lane (local claude CLI login + local judge, $0), and a CI
  # runner has no CLI login — Lane 2 is local-only by design.
  eval-routing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install promptfoo
        # Aligned with the locally-verified version (see TESTING.md) so CI
        # and local runs measure with the same client.
        run: npm install -g promptfoo@0.121.17
      - name: Routing eval (use-workshop, GLM-5.2 gate)
        run: make -C .github/skills/use-workshop/tests eval-routing
        env:
          # Covers both the candidate and the judge; run-routing.sh preflights
          # the judge and exits 2 if its provider's key is missing.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Upload result summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routing-eval-results-use-workshop
          path: .github/skills/use-workshop/tests/results/
