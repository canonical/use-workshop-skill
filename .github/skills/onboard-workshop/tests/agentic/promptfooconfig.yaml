description: |
  Agentic end-to-end eval for the onboard-workshop skill.
  Each task spawns `claude -p` in an isolated sandbox where BOTH skills
  (onboard-workshop + use-workshop) are installed, and asserts on the
  transcript, the generated definition files, and captured workshop state.
  onboard-mini-node drives a real LXD workshop (slow, side-effectful);
  honesty-gate must NOT create anything, so it runs without touching LXD.
  Default model is Sonnet 4.6; per-task overrides via vars.

prompts:
  # Each task supplies its own `task` var; this prompt template is just a
  # passthrough so promptfoo's pipeline accepts the test cases.
  - "{{task}}"

providers:
  - id: file://provider-claude-cli.js
    config:
      model: claude-sonnet-4-6
      # Resolved relative to the agentic/ dir promptfoo runs from (via
      # `make eval-agentic`): five levels up to the repo root. Override with
      # AGENTIC_REPO_ROOT when invoking from anywhere else.
      repo_root: ../../../../..
      agent_timeout_ms: 900000
      max_budget_usd: 3

defaultTest:
  options:
    cache: false

tests:
  - file://tasks/onboard-mini-node.yaml
  - file://tasks/honesty-gate.yaml
